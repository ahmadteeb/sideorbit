name: release

# A tag vX.Y.Z publishes. Running it by hand is a dry run: everything is built
# and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A release must be a commit that is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tagged commit is not on main"; exit 1; }
      - id: read
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    uses: ./.github/workflows/server.yml
  web:
    uses: ./.github/workflows/web.yml
  ios:
    needs: version
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Each architecture is built natively with the same Dockerfile.
  image:
    needs: [version, server, web]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orbit-server"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -f server/Dockerfile -t "$image:$VERSION-${{ matrix.arch }}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" .
      - name: Push
        if: env.PUBLISH == 'true'
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  publish:
    needs: [version, ios, image]
    if: needs.version.outputs.publish == 'true'
    # Add required reviewers to this environment to approve each release.
    environment: release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Orbit.ipa
      - name: Join the images into one multi-arch tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orbit-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:latest" \
            "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}' > digest
          echo "Server image: \`$image:$VERSION@$(cat digest)\`" > notes.md
          printf '\n`Orbit.ipa` is unsigned. The desktop setup app and the LiveContainer variant are not built yet.\n' >> notes.md
      - name: Checksums
        run: sha256sum Orbit.ipa > SHA256SUMS
      - name: Create the GitHub release
        run: >
          gh release create "$GITHUB_REF_NAME" Orbit.ipa SHA256SUMS --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "Orbit $VERSION" --notes-file notes.md --generate-notes
