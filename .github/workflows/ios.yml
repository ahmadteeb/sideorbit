name: ios

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OrbitTheme.swift matches the design system copy
        run: diff design-system/orbit/OrbitTheme.swift ios/Orbit/DesignSystem/OrbitTheme.swift
      - name: Unit tests (OrbitKit)
        run: swift test --package-path ios/Packages/OrbitKit
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build (unsigned)
        run: >
          xcodebuild -project ios/Orbit.xcodeproj -scheme Orbit -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO build
      - name: Package Orbit.ipa
        run: |
          mkdir Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Orbit.app Payload/
          zip -qr Orbit.ipa Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Orbit.ipa
          path: Orbit.ipa
          if-no-files-found: error
